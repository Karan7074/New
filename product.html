<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Product details — Doge store." />
  <title>Product — Doge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark" aria-hidden="true">🐕</span> Do<b>ge</b>
      </a>
      <nav class="main-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#perks">Why Doge</a>
        <a href="cart.html">Cart</a>
      </nav>
      <div class="header-actions">
        <button class="cart-btn" data-open-cart aria-label="Open cart">
          🛍️<span class="cart-count" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <nav class="breadcrumb" id="breadcrumb">
      <a href="index.html">Home</a> / <a href="index.html#shop">Shop</a>
    </nav>
    <div id="detail-root"></div>

    <!-- Related -->
    <section class="section" style="padding-top:10px">
      <div class="section-head"><div><h2>You might also wow</h2></div></div>
      <div class="product-grid" id="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-bottom" style="border:none;justify-content:center">
        <span>© 2026 Doge Store. All wows reserved. 💛</span>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    function onDogeReady() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const p = byId(id);
      const root = document.getElementById('detail-root');

      if (!p) {
        root.innerHTML = `<div class="empty-state"><span class="emo">🐶</span>Product not found. Such missing.<br><a href="index.html" class="btn btn-primary" style="margin-top:14px">Back to shop</a></div>`;
        return;
      }

      document.title = `${p.name} — Doge`;
      document.getElementById('breadcrumb').insertAdjacentHTML('beforeend', ` / <span>${p.name}</span>`);

      const was = p.was ? `<span class="was">${money(p.was)}</span>` : '';
      const tag = p.tag ? `<span class="product-tag tag-${p.tag}" style="position:static;display:inline-block;margin-bottom:10px">${TAG_LABEL[p.tag] || p.tag}</span>` : '';

      root.innerHTML = `
        <div class="detail">
          <div class="detail-media" aria-hidden="true">${p.emoji}</div>
          <div>
            <span class="product-cat">${p.cat}</span>
            <h1>${p.name}</h1>
            <span class="product-rating">${ratingStars(p.rating)} <span class="count">${p.rating} · ${p.reviews} reviews</span></span>
            <span class="price">${was}${money(p.price)}</span>
            <p class="detail-desc">${p.desc}</p>
            <div class="detail-actions">
              <div class="qty">
                <button id="d-dec" aria-label="Decrease quantity">−</button>
                <input id="d-qty" value="1" inputmode="numeric" aria-label="Quantity" />
                <button id="d-inc" aria-label="Increase quantity">+</button>
              </div>
              <button class="btn btn-primary" id="d-add">Add to bag 🛍️</button>
              <button class="btn btn-ghost" id="d-buy">Buy now</button>
            </div>
            <div class="detail-meta">
              <span>🚚 Free shipping over $50 · ships in 1–2 business days</span>
              <span>↩️ 30-day returns · 💛 1-year quality guarantee</span>
            </div>
          </div>
        </div>`;

      const qtyInput = document.getElementById('d-qty');
      const clampQty = () => {
        let v = parseInt(qtyInput.value, 10);
        if (isNaN(v) || v < 1) v = 1;
        qtyInput.value = v;
        return v;
      };
      document.getElementById('d-inc').onclick = () => { qtyInput.value = clampQty() + 1; };
      document.getElementById('d-dec').onclick = () => { qtyInput.value = Math.max(1, clampQty() - 1); };
      qtyInput.addEventListener('change', clampQty);
      document.getElementById('d-add').onclick = () => addToCart(p.id, clampQty());
      document.getElementById('d-buy').onclick = () => { addToCart(p.id, clampQty()); location.href = 'cart.html'; };

      // related products (same category, exclude current)
      const grid = document.getElementById('product-grid');
      const related = PRODUCTS.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 4);
      const fill = related.length ? related : PRODUCTS.filter((x) => x.id !== p.id).slice(0, 4);
      grid.innerHTML = fill.map(productCardHTML).join('');
    }
  </script>
</body>
</html>
